name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyflakes
      - name: Static check
        run: python -m pyflakes app.py pages src config evaluation deploy colab tests
      - name: Shell scripts parse
        run: for f in deploy/gpu/*.sh deploy/k8s/*.sh; do bash -n "$f"; done
      - name: Tests (no language model; extractive mode)
        env:
          EDUROUTE_LLM_BACKEND: extractive
        run: python -m pytest -q -m "not slow"
